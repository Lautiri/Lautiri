name: Profile card

on:
  schedule:
    - cron: "15 6 * * *"   # every day, 03:15 in Buenos Aires
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/robot.json", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # contribution snake in the card colours, published to the "output" branch
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#FF7A1A&color_dots=#161616,#4A2A12,#8A4515,#C8601A,#FF7A1A&color_background=#0A0A0A
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the card with fresh GitHub numbers; commits only when something changed
      - run: python3 scripts/build_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git diff --quiet assets/card.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card.svg
          git commit -m "Tarjeta: datos del día"
          git push
